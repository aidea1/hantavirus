// Parser: handles repeated "San" by tagging first/second occurrence per date.
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const header = lines.shift();
  const rows = [];
  let lastDate = null, sanCount = 0;
  for (const line of lines){
    const [Date, SearchInterest, DMA, Term] = line.split(",");
    if (Date !== lastDate){ sanCount = 0; lastDate = Date; }
    let key = DMA;
    if (DMA === "San"){ sanCount++; key = `San__${sanCount}`; }
    const meta = DMA_LOOKUP[key];
    if (!meta) continue; // skip unknown
    rows.push({
      Date,
      SearchInterest: +SearchInterest,
      DMA_Key: key,
      DMA_Name: meta.name,
      DMA_Code: meta.code,
      Region: meta.region,
      lat: meta.lat,
      lng: meta.lng,
      Term,
    });
  }
  return rows;
}

// ------------------- Helpers ------------------------------------------------
const fmt = n => {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(2)+"M";
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1)+"k";
  return Math.round(n).toLocaleString();
};
const pct = n => `${n>=0?"+":""}${(n*100).toFixed(0)}%`;

// ---------- Animation primitives -----------------------------------------
// useRAF: subscribes a callback to requestAnimationFrame, gives a t-delta in seconds.
function useRAF(cb, active){
  const ref = useRef();
  useEffect(()=>{
    if (!active) return;
    let last = performance.now();
    let raf;
    const loop = (now) => {
      const dt = (now - last) / 1000;
      last = now;
      cb(dt);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [active, cb]);
  return ref;
}

// usePlayback: virtual time index in [0, n-1] that auto-advances at `speed` units/sec.
// Returns { vIdx, playing, setPlaying, setVIdx, speed, setSpeed, reset }.
function usePlayback(n, opts={}){
  const { speed: initSpeed = 0.2, loop = true } = opts;
  const [playing, setPlaying] = useState(true);
  const [vIdx, setVIdx]     = useState(0);
  const [speed, setSpeed]   = useState(initSpeed);
  const cb = useCallback((dt) => {
    setVIdx(v => {
      const next = v + dt * speed;
      if (next >= n - 1){
        if (loop) return 0;
        setPlaying(false);
        return n - 1;
      }
      return next;
    });
  }, [n, speed, loop]);
  useRAF(cb, playing);
  const reset = () => setVIdx(0);
  return { vIdx, playing, setPlaying, setVIdx, speed, setSpeed, reset };
}

// useAnimatedNumber: eases a number toward a target.
function useAnimatedNumber(target, durationMs = 1400){
  const [v, setV] = useState(target);
  const fromRef = useRef(target);
  const startRef = useRef(performance.now());
  useEffect(()=>{
    fromRef.current = v;
    startRef.current = performance.now();
    let raf;
    const tick = (now) => {
      const t = Math.min(1, (now - startRef.current) / durationMs);
      const e = 1 - Math.pow(1 - t, 3); // easeOutCubic
      setV(fromRef.current + (target - fromRef.current) * e);
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, durationMs]);
  return v;
}

function AnimatedNumber({ value, format = (x)=> Math.round(x).toLocaleString(), className="" }){
  const v = useAnimatedNumber(value);
  return <span className={`num-anim ${className}`}>{format(v)}</span>;
}

// Biohazard ramp
const RAMP = ["#0f172a","#7c2d12","#b45309","#dc2626","#ef4444","#f97316","#fbbf24"];
function ramp(v, max){
  if (!max) return RAMP[0];
  const r = Math.min(1, Math.max(0, v/max));
  if (r < 0.05) return RAMP[0];
  if (r < 0.15) return RAMP[1];
  if (r < 0.30) return RAMP[2];
  if (r < 0.45) return RAMP[3];
  if (r < 0.65) return RAMP[4];
  if (r < 0.85) return RAMP[5];
  return RAMP[6];
}

// ------------------- Western US SVG map -------------------------------------
function ProjMap({ data, onHover, gMax }){
  const W = 720, H = 460;
  const lonMin=-125, lonMax=-95, latMin=30, latMax=49.5;
  const x = lon => ( (lon-lonMin) / (lonMax-lonMin) ) * W;
  const y = lat => H - ( (lat-latMin) / (latMax-latMin) ) * H;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full">
      <rect x="0" y="0" width={W} height={H} fill="#020617"/>
      <g opacity="0.5">
        {Array.from({length:8}).map((_,i)=>(<line key={i} x1="0" x2={W} y1={H*i/8} y2={H*i/8} stroke="#1e293b" strokeWidth="1" />))}
        {Array.from({length:10}).map((_,i)=>(<line key={i} x1={W*i/10} x2={W*i/10} y1="0" y2={H} stroke="#1e293b" strokeWidth="1" />))}
      </g>
      {/* Four Corners */}
      <rect x={x(-110)} y={y(38.5)} width={x(-107)-x(-110)} height={y(35.5)-y(38.5)}
            fill="none" stroke="rgba(239,68,68,.45)" strokeDasharray="4 4" />
      <text x={x(-109.5)} y={y(38.7)} fontSize="11" fill="#fca5a5" className="mono">Four Corners</text>
      {/* Pacific NW */}
      <rect x={x(-124)} y={y(48.5)} width={x(-117)-x(-124)} height={y(42.5)-y(48.5)}
            fill="none" stroke="rgba(34,211,238,.45)" strokeDasharray="4 4" />
      <text x={x(-123.5)} y={y(48.7)} fontSize="11" fill="#67e8f9" className="mono">Pacific NW</text>

      {data.map(d => {
        const cx = x(d.lng), cy = y(d.lat);
        const intensity = gMax ? d.SearchInterest / gMax : 0;
        const r = 4 + intensity * 32;
        const fill = ramp(d.SearchInterest, gMax);
        const glow = intensity > 0.4;
        return (
          <g key={d.DMA_Code} onMouseEnter={()=>onHover && onHover(d)} onMouseLeave={()=>onHover && onHover(null)}>
            {glow && (
              <circle cx={cx} cy={cy} r={r+10} fill={fill}
                      className="breathe"
                      style={{ "--rmin": (r+6)+"px", "--rmax": (r+18)+"px" }} />
            )}
            <circle className="marker-circle" cx={cx} cy={cy} r={r} fill={fill} opacity="0.90"
                    stroke="#fde68a" strokeOpacity={intensity>0.6?0.7:0} strokeWidth="1"/>
            <text x={cx+r+3} y={cy+3} fontSize="9" fill="#cbd5e1" className="mono">
              {d.DMA_Name.split(/[ ,(-]/)[0]}
            </text>
          </g>
        );
      })}
      {/* legend */}
      <g transform={`translate(20, ${H-30})`}>
        {RAMP.map((c,i)=>(
          <g key={i} transform={`translate(${i*60},0)`}>
            <rect width="55" height="10" fill={c} />
            <text x="0" y="22" fontSize="10" fill="#94a3b8" className="mono">{Math.round(gMax*(i/6))}</text>
          </g>
        ))}
        <text x="0" y="-5" fontSize="10" fill="#94a3b8" className="mono">SearchInterest (Google Health Trends, v1alpha)</text>
      </g>
    </svg>
  );
}

// ------------------- DMA × Date heatmap (SVG) -------------------------------
function HeatGrid({ rows, dates, dmas, gMax, activeIdx = -1 }){
  const cellW = 60, cellH = 18, leftPad = 220, topPad = 30;
  const W = leftPad + cellW * dates.length;
  const H = topPad + cellH * dmas.length;
  return (
    <div className="scrollx scroll-thin">
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`}>
        {/* Active column highlight band */}
        {activeIdx >= 0 && activeIdx < dates.length && (
          <rect x={leftPad + activeIdx*cellW} y={topPad - 22} width={cellW} height={H - topPad + 22}
                fill="rgba(253,230,138,.08)" stroke="rgba(253,230,138,.45)" strokeDasharray="3 3"/>
        )}
        {dates.map((d,i)=>(
          <text key={d} x={leftPad + i*cellW + cellW/2} y={20} fontSize="10"
                fill={i===activeIdx?"#fde68a":"#94a3b8"} textAnchor="middle" className="mono">{d.slice(5)}</text>
        ))}
        {dmas.map((dma,j) => (
          <g key={dma.key}>
            <text x={leftPad-8} y={topPad + j*cellH + 13} fontSize="10" fill="#cbd5e1" textAnchor="end" className="mono">{dma.name}</text>
            {dates.map((d,i)=>{
              const r = rows.find(x => x.Date === d && x.DMA_Key === dma.key);
              const v = r ? r.SearchInterest : 0;
              return (
                <rect key={i} className={`heat-cell ${i===activeIdx?"heat-cell-active":""}`}
                      x={leftPad + i*cellW + 1} y={topPad + j*cellH + 1}
                      width={cellW-2} height={cellH-2}
                      fill={ramp(v, gMax)} opacity={v>0?0.95:0.25}>
                  <title>{`${dma.name} · ${d}\nSearchInterest: ${fmt(v)}`}</title>
                </rect>
              );
            })}
          </g>
        ))}
      </svg>
    </div>
  );
}

// ------------------- Live ArcGIS status counts (best-effort fetch) ----------
function useArcGIS(intervalMs = 60000){
  const [state, setState] = useState({ loading:true, ok:false, counts:null, total:0, error:null, fetchedAt:null });
  const poll = useCallback(() => {
    const url = "https://services1.arcgis.com/wb4Og4gH5mvzQAIV/arcgis/rest/services/Tracking_Hantavirus_2026/FeatureServer/1/query?where=1%3D1&outFields=*&f=geojson&resultRecordCount=2000";
    fetch(url, { method:"GET" })
      .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status)))
      .then(j => {
        const feats = (j && j.features) || [];
        const counts = { CONFIRMED:0, DECEASED:0, SUSPECTED:0, MONITORING:0, OTHER:0 };
        feats.forEach(f => {
          const s = ((f.properties && (f.properties.STATUS || f.properties.Status || f.properties.status)) || "").toUpperCase();
          if (counts[s] !== undefined) counts[s]++; else counts.OTHER++;
        });
        setState({ loading:false, ok:true, counts, total:feats.length, error:null, fetchedAt:new Date().toISOString() });
      })
      .catch(e => setState({ loading:false, ok:false, counts:null, total:0, error:String(e), fetchedAt:new Date().toISOString() }));
  }, []);
  useEffect(()=>{
    poll();
    const id = setInterval(poll, intervalMs);
    return () => clearInterval(id);
  }, [poll, intervalMs]);
  return { ...state, refetch: poll };
}

// ---------- Live ticker -----------------------------------------------------
function Ticker({ items }){
  // duplicate the items so the CSS marquee can loop seamlessly
  const stream = [...items, ...items];
  return (
    <div className="bg-slate-900/70 border-y border-slate-800 overflow-hidden">
      <div className="max-w-[1500px] mx-auto px-4 py-1.5">
        <div className="ticker-track text-[11px] mono text-slate-300">
          {stream.map((it,i) => (
            <span key={i} className="inline-flex items-center gap-2">
              <span className={`inline-block w-2 h-2 rounded-full ${it.tone==='red'?'bg-red-500':it.tone==='amber'?'bg-amber-400':it.tone==='cyan'?'bg-cyan-400':'bg-emerald-400'}`}></span>
              <span className={it.tone==='red'?'text-red-300':it.tone==='amber'?'text-amber-300':it.tone==='cyan'?'text-cyan-300':'text-emerald-300'}>{it.tag}</span>
              <span className="text-slate-300">{it.msg}</span>
            </span>
          ))}
        </div>
      </div>
    </div>
  );
}

// ====================== MAIN APP ============================================
function App(){
  const rows = useMemo(()=> parseCSV(CSV), []);
  const dates = useMemo(()=> Array.from(new Set(rows.map(r=>r.Date))).sort(), [rows]);
  const dmas  = useMemo(()=> {
    const seen = new Map();
    rows.forEach(r => { if (!seen.has(r.DMA_Key)) seen.set(r.DMA_Key, { key:r.DMA_Key, name:r.DMA_Name, code:r.DMA_Code, region:r.Region, lat:r.lat, lng:r.lng }); });
    return [...seen.values()].sort((a,b)=> a.name.localeCompare(b.name));
  }, [rows]);

  // global max across all dates × dmas (for color normalization)
  const gMax = useMemo(()=> rows.reduce((m,r)=> r.SearchInterest>m?r.SearchInterest:m, 0), [rows]);

  // National daily aggregates
  const national = useMemo(()=>{
    return dates.map(d => {
      const day = rows.filter(r => r.Date === d);
      const total = day.reduce((s,r)=> s + r.SearchInterest, 0);
      const mean  = total / day.length;
      const active = day.filter(r => r.SearchInterest > 0).length;
      const max = day.reduce((m,r)=> r.SearchInterest>m?r.SearchInterest:m, 0);
      return { Date: d, Total: +total.toFixed(0), Mean: +mean.toFixed(1), ActiveDMAs: active, Peak: +max.toFixed(0) };
    });
  }, [dates, rows]);

  // Peak DMA + peak date
  const peakRow = useMemo(()=> rows.slice().sort((a,b)=> b.SearchInterest - a.SearchInterest)[0], [rows]);
  // 7-day surge: D-(start) vs D-(peak)
  const t0 = national[0], tpk = national.slice().sort((a,b)=> b.Total - a.Total)[0];
  const surgeMult = tpk.Total / Math.max(1, t0.Total);

  // Per-DMA aggregates
  const dmaAgg = useMemo(()=>{
    return dmas.map(d => {
      const arr = rows.filter(r => r.DMA_Key === d.key);
      const total = arr.reduce((s,r)=> s + r.SearchInterest, 0);
      const peak = arr.reduce((m,r)=> r.SearchInterest>m?r.SearchInterest:m, 0);
      const peakDate = (arr.find(r => r.SearchInterest === peak) || {}).Date;
      const last = arr[arr.length-1];
      const first = arr[0];
      // baseline = mean of days 1–2 (pre-outbreak); surge = mean of days 4–7 (post-outbreak)
      const base = (arr[0].SearchInterest + arr[1].SearchInterest)/2;
      const peakWin = arr.slice(3,7).reduce((s,r)=>s+r.SearchInterest,0)/4;
      const ratio = base > 0 ? peakWin / base : (peakWin > 0 ? 9999 : 0);
      // velocity: last vs prior day
      const prev = arr[arr.length-2] || first;
      const delta = last.SearchInterest - prev.SearchInterest;
      return { ...d, total, peak, peakDate, last:last.SearchInterest, base, peakWin, ratio, delta };
    });
  }, [rows, dmas]);

  // "Broken the silence" : DMAs that were zero on May 1–2 and surged on/after May 3
  const silenceBroken = useMemo(()=>{
    return dmaAgg.filter(d => d.base === 0 && d.peak > 0).sort((a,b)=> b.peak - a.peak);
  }, [dmaAgg]);

  // ----- Playback engine: virtual time index in [0, dates.length - 1] -----
  const playback = usePlayback(dates.length, { speed: 0.2, loop: true });
  const vIdx = playback.vIdx;
  const iA = Math.max(0, Math.min(dates.length-1, Math.floor(vIdx)));
  const iB = Math.min(dates.length-1, iA + 1);
  const tFrac = vIdx - iA;
  const snapDate = dates[iA];
  const snapDateNext = dates[iB];

  // Interpolated snapshot: lerp between dates[iA] and dates[iA+1]
  const snapshot = useMemo(()=>{
    const rowsA = rows.filter(r => r.Date === snapDate);
    const rowsB = rows.filter(r => r.Date === snapDateNext);
    const byKeyB = new Map(rowsB.map(r => [r.DMA_Key, r]));
    return rowsA.map(a => {
      const b = byKeyB.get(a.DMA_Key) || a;
      return { ...a, SearchInterest: a.SearchInterest + (b.SearchInterest - a.SearchInterest) * tFrac };
    });
  }, [rows, snapDate, snapDateNext, tFrac]);

  // Interpolated national totals for animated stat cards
  const nationalNow = useMemo(()=>{
    const A = national[iA], B = national[iB] || national[iA];
    return {
      Date: snapDate,
      Total:      A.Total      + (B.Total      - A.Total)      * tFrac,
      Mean:       A.Mean       + (B.Mean       - A.Mean)       * tFrac,
      ActiveDMAs: A.ActiveDMAs + (B.ActiveDMAs - A.ActiveDMAs) * tFrac,
      Peak:       A.Peak       + (B.Peak       - A.Peak)       * tFrac,
    };
  }, [national, iA, iB, snapDate, tFrac]);

  // Heatmap rows ordered by total descending
  const heatDMAs = useMemo(()=> [...dmaAgg].sort((a,b)=> b.total - a.total), [dmaAgg]);

  // Risk advisory (national-level threshold)
  const advisory = (() => {
    const latest = national[national.length-1];
    if (latest.Mean > 20000) return { level:"HIGH",     tone:"red",   note:"Sustained nationwide surge; mean SearchInterest > 20k across Western DMAs." };
    if (latest.Mean > 5000)  return { level:"ELEVATED", tone:"amber", note:"Active signal across majority of Western DMAs; possible secondary wave dynamics." };
    if (latest.Mean > 500)   return { level:"WATCH",    tone:"cyan",  note:"Decaying signal toward post-outbreak baseline; localized hotspots may persist." };
    return { level:"LOW", tone:"em", note:"Baseline ecological dormancy; routine vigilance." };
  })();

    items.push({ tone:"em",    tag:"SILENCE-BREAK", msg:`${silenceBroken.length}/${dmas.length} rural DMAs recovered from k-anonymity suppression via Grouped Expressions` });
    items.push({ tone:"cyan",  tag:"WHO",           msg:"DON599 — Andes virus cluster (MV Hondius); strain ID confirmed (CBC News, Nature sequencing)" });
    items.push({ tone:"red",   tag:"CDC",           msg:"HPS clinical guidance active for Western US DMAs; Lubbock TX action vector flagged" });
    if (arc.ok && arc.counts){
      items.push({ tone:"red",   tag:"ARCGIS", msg:`Live overlay · Confirmed ${arc.counts.CONFIRMED} · Deceased ${arc.counts.DECEASED} · Suspected ${arc.counts.SUSPECTED} · Monitoring ${arc.counts.MONITORING}` });
    } else {

    }
    items.push({ tone:"amber", tag:"ECDC",  msg:"Weekly CDTR — EU returnees from MV Hondius monitored across Spain, Germany, France, UK, NL, CH, PT" });
    items.push({ tone:"em",    tag:"PAHO",  msg:"Americas-region surveillance · Andes virus reservoir Argentina (Patagonia) + Chile" });
    items.push({ tone:"cyan",  tag:"WINDOW",msg:`Data window ${dateFirst} → ${dateLast} · ${dates.length} days · ${dmas.length} Western US DMAs` });
    return items;

  // First/last date of data
  const dateFirst = dates[0], dateLast = dates[dates.length-1];

  return (
    <div className="grid-bg min-h-screen">
      {/* HEADER */}
      <header className="sticky top-0 z-30 bg-slate-950/85 backdrop-blur border-b border-slate-800/80">

              {I("biohazard","w-6 h-6")}
              <style>{`[data-lucide="biohazard"]{ color: var(--ndsu-gold); }`}</style>
            </div>
            <div>
              <div className="text-base md:text-lg font-bold tracking-tight text-slate-100">Hantavirus Digital Epidemiology Command Center</div>
              <div className="text-[11px] md:text-xs text-slate-400 mono">
                <a href="https://www.ndsu.edu/people/akshaya-bhagavathula" target="_blank" rel="noreferrer" className="text-ndsu-gold hover:underline">Akshaya Bhagavathula, PhD FACE</a>
                <span className="text-slate-500"> · </span>
                Professor of Epidemiology, Department of Public Health

            <div className={`rounded-xl p-4 border ${advisory.tone==='red' ? 'bg-red-500/10 border-red-500/40' : advisory.tone==='amber' ? 'bg-amber-500/10 border-amber-500/40' : 'bg-emerald-500/10 border-emerald-500/40'}`}>
              <div className="flex items-center justify-between">
                <span className="uppercase tracking-widest text-xs text-slate-300">Current Level</span>
                <Pill color={advisory.tone}>{advisory.level}</Pill>
              </div>
              <div className="mt-2 text-sm text-slate-200">{advisory.note}</div>
              <div className="mt-3 grid grid-cols-2 gap-2 text-xs">
                <div className="bg-slate-900/60 rounded-lg p-2 border border-slate-800">
                  <div className="text-slate-400">Latest mean</div>
                  <div className="mono text-slate-100">{fmt(national[national.length-1].Mean)}</div>
                </div>
                <div className="bg-slate-900/60 rounded-lg p-2 border border-slate-800">
                  <div className="text-slate-400">Latest Σ</div>
                  <div className="mono text-slate-100">{fmt(national[national.length-1].Total)}</div>
                </div>
              </div>
            </div>
            <div className="mt-3 text-[11px] text-slate-400">
              Action vector: target <span className="text-amber-300">"Safe Cleaning"</span> intervention to high-Σ DMAs below (e.g., DMA 651 Lubbock, DMA 753 Phoenix, DMA 819 Seattle-Tacoma).
            </div>
          </Card>

          {/* ArcGIS live overlay */}
          <Card title="ArcGIS Live Case Overlay" subtitle="Tracking_Hantavirus_2026 · FeatureServer/1 · polls 60s"
                glow="violet" icon={I("satellite","w-4 h-4 text-violet-300")}
                right={<button className="btn-ghost" onClick={()=> arc.refetch && arc.refetch()}>⟳ refresh</button>}>
            {arc.loading && <div className="text-xs text-slate-400">contacting FeatureServer…</div>}
            {arc.ok && arc.counts && (
              <div className="grid grid-cols-2 gap-2">
                <div className="bg-rose-500/10 border border-rose-500/40 rounded-lg p-2">
                  <div className="text-[10px] uppercase text-rose-200">Deceased</div>
                  <div className="mono text-xl text-rose-200"><AnimatedNumber value={arc.counts.DECEASED}/></div>
                </div>
                <div className="bg-red-500/10 border border-red-500/40 rounded-lg p-2">
                  <div className="text-[10px] uppercase text-red-200">Confirmed</div>
                  <div className="mono text-xl text-red-200"><AnimatedNumber value={arc.counts.CONFIRMED}/></div>
                </div>
                <div className="bg-amber-500/10 border border-amber-500/40 rounded-lg p-2">
                  <div className="text-[10px] uppercase text-amber-200">Suspected</div>
                  <div className="mono text-xl text-amber-200"><AnimatedNumber value={arc.counts.SUSPECTED}/></div>
                </div>
                <div className="bg-cyan-500/10 border border-cyan-500/40 rounded-lg p-2">
                  <div className="text-[10px] uppercase text-cyan-200">Monitoring</div>
                  <div className="mono text-xl text-cyan-200"><AnimatedNumber value={arc.counts.MONITORING}/></div>
                </div>
                <div className="col-span-2 text-[11px] text-slate-400">total features: <AnimatedNumber value={arc.total}/> · last refresh <span className="mono">{arc.fetchedAt && arc.fetchedAt.slice(11,19)}</span></div>
              </div>
            )}
            {!arc.ok && !arc.loading && (
              <div className="text-[12px] text-slate-300 leading-relaxed">
                <div className="text-rose-300 mono mb-1">offline / CORS blocked</div>
                Last attempt: <span className="mono">{arc.fetchedAt}</span><br/>
                Open the FeatureServer directly: <a className="text-cyan-300 underline" target="_blank" rel="noreferrer" href="https://services1.arcgis.com/wb4Og4gH5mvzQAIV/arcgis/rest/services/Tracking_Hantavirus_2026/FeatureServer/1/query?where=1%3D1&outFields=*&f=geojson&resultRecordCount=2000">FeatureServer/1/query</a>
              </div>
            )}
            <div className="mt-2 text-[11px] text-slate-500">
              Status field values: CONFIRMED · DECEASED · SUSPECTED · MONITORING. Independent research feed (Panozzo / GISAG). Tentative counts; situational awareness only.
            </div>
          </Card>
        </aside>

        {/* ===== MAP + SNAPSHOT CONTROLS ===== */}
        <section className="col-span-12 xl:col-span-8">
          <Card
            title="Geospatial Risk Heatmap — Western US (DMA resolution)"
            subtitle="Snapshot per date · symbol radius & color = SearchInterest · biohazard ramp"
            glow="red"
            icon={I("globe-2","w-4 h-4 text-red-400")}
            right={
              <div className="flex items-center gap-2">
                {hover ? <Pill color="amber">{hover.DMA_Name} · {fmt(hover.SearchInterest)}</Pill> : <Pill color="slate">hover a DMA</Pill>}
                <Pill color="cyan">t = {snapDate} ({(tFrac*100).toFixed(0)}%)</Pill>
                <button className="btn-ghost" onClick={()=> playback.setPlaying(p => !p)}>{playback.playing?"❚❚":"▶"}</button>
              </div>
            }
          >
            <div className="h-[460px] rounded-xl overflow-hidden border border-slate-800 bg-slate-950/70">
              <ProjMap data={snapshot} gMax={gMax} onHover={setHover}/>
            </div>
            <div className="mt-2 flex items-center gap-2 flex-wrap text-[11px] text-slate-400">
              <Pill color="red">Four Corners endemic zone</Pill>
              <Pill color="cyan">Pacific NW reservoir corridor</Pill>
              <span>· global max in window = <span className="mono text-slate-200">{fmt(gMax)}</span></span>
            </div>
          </Card>
        </section>

        {/* ===== LEADERBOARD ===== */}
        <aside className="col-span-12 xl:col-span-4">
          <Card title="Top-15 DMA · 10-day Σ" subtitle="Cumulative SearchInterest" glow="cyan" icon={I("list-ordered","w-4 h-4 text-cyan-300")}>
            <div className="h-[460px]">
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={[...dmaAgg].sort((a,b)=>b.total-a.total).slice(0,15)} layout="vertical" margin={{ left: 4, right: 24 }}>
                  <CartesianGrid stroke="#1e293b" horizontal={false} />
                  <XAxis type="number" tick={{ fill:"#94a3b8", fontSize:10 }} tickFormatter={fmt}/>
                  <YAxis dataKey="name" type="category" tick={{ fill:"#cbd5e1", fontSize:10 }} width={160}/>
                  <Tooltip contentStyle={{ background:"#0f172a", border:"1px solid #334155", color:"#e2e8f0" }} formatter={(v)=> fmt(v)}/>
                  <Bar dataKey="total" radius={[0,6,6,0]}>
                    {[...dmaAgg].sort((a,b)=>b.total-a.total).slice(0,15).map((s,i)=>(
                      <Cell key={i} fill={i<3 ? "#ef4444" : i<7 ? "#f59e0b" : "#22d3ee"}/>
                    ))}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </Card>
        </aside>

        {/* ===== HEATMAP ===== */}
        <section className="col-span-12">
          <Card
            title="DMA × Date Intensity Matrix"
            subtitle="Full 41 × 10 grid · ordered by 10-day Σ · cell color encodes daily SearchInterest"
            glow="amber"
            icon={I("grid-3x3","w-4 h-4 text-amber-400")}
          >
            <HeatGrid rows={rows} dates={dates} dmas={heatDMAs} gMax={gMax} activeIdx={iA}/>
            <div className="mt-2 text-[11px] text-slate-400">
              May 1–2 ≈ <span className="text-cyan-300">"Rural Silence"</span> (only 6–7 DMAs emit, ABQ leads). May 3 = <span className="text-amber-300">simultaneous nationwide silence-break</span> across 39/41 DMAs. May 4–8 plateau. Decay May 9–10.
            </div>
          </Card>
        </section>

        {/* ===== SILENCE-BREAK TABLE ===== */}
        <section className="col-span-12 xl:col-span-6">
          <Card title="Silence-Break Tracker" subtitle="DMAs with 0 baseline (May 1–2) that surged ≥ May 3" glow="em" icon={I("zap","w-4 h-4 text-emerald-400")}>
            <div className="max-h-[360px] overflow-auto scroll-thin pr-2">
              <table className="w-full text-xs">
                <thead><tr className="text-slate-500 uppercase tracking-widest">
                  <th className="text-left py-1">DMA</th><th className="text-right">Region</th>
                  <th className="text-right">Baseline</th><th className="text-right">Peak</th><th className="text-right">PeakDate</th>
                </tr></thead>
                <tbody>
                  {silenceBroken.map(s => (
                    <tr key={s.code} className="border-t border-slate-800/60 hover:bg-slate-800/30">
                      <td className="py-1.5"><div className="text-slate-200">{s.name}</div><div className="text-[10px] text-slate-500">DMA {s.code}</div></td>
                      <td className="text-right text-slate-400">{s.region}</td>
                      <td className="text-right mono text-slate-400">0</td>
                      <td className="text-right mono text-rose-300">{fmt(s.peak)}</td>
                      <td className="text-right mono text-amber-300">{s.peakDate}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        </section>

        {/* ===== SURGE VELOCITY ===== */}
        <section className="col-span-12 xl:col-span-6">
          <Card title="Surge Velocity (Δ today vs prior)" subtitle="Late-window change in SearchInterest" glow="amber" icon={I("trending-up","w-4 h-4 text-amber-400")}>
            <div className="h-[360px]">
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={[...dmaAgg].sort((a,b)=> b.delta - a.delta).slice(0,15)} layout="vertical" margin={{ left: 4, right: 24 }}>
                  <CartesianGrid stroke="#1e293b" horizontal={false} />
                  <XAxis type="number" tick={{ fill:"#94a3b8", fontSize:10 }} tickFormatter={fmt}/>
                  <YAxis dataKey="name" type="category" tick={{ fill:"#cbd5e1", fontSize:10 }} width={160}/>
                  <Tooltip contentStyle={{ background:"#0f172a", border:"1px solid #334155", color:"#e2e8f0" }} formatter={(v)=> fmt(v)}/>
                  <Bar dataKey="delta" radius={[0,6,6,0]}>
                    {[...dmaAgg].sort((a,b)=> b.delta - a.delta).slice(0,15).map((s,i)=>(
                      <Cell key={i} fill={s.delta>=0 ? "#22c55e" : "#ef4444"}/>
                    ))}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </Card>
        </section>

        {/* ===== OUTBREAK CONTEXT (MV HONDIUS) ===== */}
        <section className="col-span-12">
          <Card title="Outbreak Context · MV Hondius / Andes virus cluster" subtitle="Cross-referenced with ArcGIS Tracking_Hantavirus_2026 FeatureServer" glow="violet" icon={I("ship","w-4 h-4 text-violet-300")}>
            <div className="grid grid-cols-1 md:grid-cols-4 gap-3 text-sm">
              <div className="bg-slate-900/50 rounded-xl border border-slate-800 p-3">
                <div className="text-violet-300 font-semibold mb-1">Origin</div>
                Ushuaia, Argentina (Patagonia) — Andes virus endemic range. Reservoir: <em>Oligoryzomys longicaudatus</em>.
              </div>
              <div className="bg-slate-900/50 rounded-xl border border-slate-800 p-3">
                <div className="text-violet-300 font-semibold mb-1">Atlantic transit</div>
                Cape Verde → Madeira → Cádiz/Tenerife. Port-of-arrival contact tracing by Spain (Ministerio de Sanidad), DGS Portugal.
              </div>
              <div className="bg-slate-900/50 rounded-xl border border-slate-800 p-3">
                <div className="text-violet-300 font-semibold mb-1">Returnees</div>
                UKHSA, RKI Germany, Santé publique France, BAG Switzerland, Amsterdam UMC (NOS) — monitoring contacts.
              </div>
              <div className="bg-slate-900/50 rounded-xl border border-slate-800 p-3">
                <div className="text-violet-300 font-semibold mb-1">USA digital echo · bimodal</div>
                Wave 1 (May 3–8) — synchronous nationwide silence-break following WHO DON599 + CBC strain ID. Wave 2 (May 11–16) — Pacific NW + N. Rockies re-ignite, led by Bend OR, Seattle-Tacoma, Great Falls MT. Decay through May 17–25 toward elevated baseline.
              </div>
            </div>
            <div className="mt-3 text-[11px] text-slate-400">
              Disclaimer · This dashboard is for situational awareness only and is not medical advice. Case counts are tentative and may change as the outbreak develops.
            </div>
          </Card>
        </section>

        {/* ===== METHODOLOGY ===== */}
        <section className="col-span-12">
          <Card title="Methodology · Grouped Expression + Digital Epidemiology" subtitle="Breaking the 'Rural Silence' imposed by k-anonymity · Akshaya Bhagavathula, NDSU" glow="ndsu" icon={I("scroll-text","w-4 h-4 text-ndsu-gold")}>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm leading-relaxed text-slate-300">
              <div className="bg-slate-900/50 rounded-xl border border-slate-800 p-3">
                <div className="text-cyan-300 font-semibold mb-1">1 · The k-anonymity problem</div>
                Google Health Trends v1alpha suppresses query counts below threshold k, producing zeros that mask true low-volume signal in DMAs like Casper-Riverton, Grand Junction, Cheyenne.
              </div>
              <div className="bg-slate-900/50 rounded-xl border border-slate-800 p-3">
                <div className="text-cyan-300 font-semibold mb-1">2 · Grouped Expressions</div>
                Semantically equivalent expression bundles per concept ("mouse droppings" + "cleaning shed" + "deer mouse nest" + "rodent infestation home") submitted as a single probability query. Pools low-volume terms into one inferential unit, lifting them above k.
              </div>
              <div className="bg-slate-900/50 rounded-xl border border-slate-800 p-3">
                <div className="text-cyan-300 font-semibold mb-1">3 · Probability, not volume</div>
                Metric is P(query ∈ HantavirusIntent | DMA, date). Conditions out general curiosity and population mass, yielding a behaviorally meaningful prior that supports cross-DMA comparison and rural recoverability.
              </div>
              <div className="bg-slate-900/50 rounded-xl border border-slate-800 p-3">
                <div className="text-cyan-300 font-semibold mb-1">4 · Trophic-cascade conditioning</div>
                Signal interpreted under reservoir-host model: precipitation (t–12mo) → vegetation → <em>Peromyscus</em> density → human exposure semantics → clinical search intent. Filtering on Western US DMAs constrains inference to regions where the ecological prior holds.
              </div>
              <div className="bg-slate-900/50 rounded-xl border border-slate-800 p-3">
                <div className="text-cyan-300 font-semibold mb-1">5 · Nielsen DMA as action layer</div>
                DMA codes (vs counties/states) align surveillance with media-market geometry. Detected surges in DMA 790 (ABQ-Santa Fe) or 770 (Salt Lake) map directly to local broadcast / social clusters for targeted "Safe Cleaning" messaging.
              </div>
              <div className="bg-slate-900/50 rounded-xl border border-slate-800 p-3">
                <div className="text-cyan-300 font-semibold mb-1">6 · From lagging to leading</div>
                Traditional surveillance reports confirmed cases (lagging). E-BEWS pivots to behavioral probability (leading) — the actionable intervention window before clinical presentation.
              </div>
            </div>
            <div className="mt-4 grid grid-cols-2 md:grid-cols-5 gap-3 text-[11px]">
              {[
                ["Source",         "Google Health Trends API v1alpha"],
                ["Live overlay",   "ArcGIS FeatureServer/1 (geojson)"],
                ["Metric",         "P(query ∈ Hantavirus intent)"],
                ["Resolution",     `Nielsen DMA (n=${dmas.length})`],
                ["Window",         `${dateFirst} → ${dateLast}`],
              ].map(([k,v],i)=>(
                <div key={i} className="bg-slate-900/60 border border-slate-800 rounded-lg p-2">
                  <div className="text-slate-500 uppercase tracking-widest">{k}</div>
                  <div className="text-slate-200 mono mt-1">{v}</div>
                </div>
              ))}
            </div>
          </Card>
        </section>

        {/* ===== COMPARISON TABLE ===== */}
        <section className="col-span-12">
          <Card title="Traditional Surveillance vs E-BEWS" subtitle="Why DMA-level digital epidemiology matters" glow="cyan" icon={I("table","w-4 h-4 text-cyan-300")}>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-slate-400 uppercase text-[11px] tracking-widest">
                    <th className="text-left py-2">Feature</th>
                    <th className="text-left py-2">Traditional Surveillance</th>
                    <th className="text-left py-2">E-BEWS (this dashboard)</th>
                  </tr>
                </thead>
                <tbody className="text-slate-200">
                  {[
                    ["Data Source",   "Hospital / Lab reports",            "Google Health Trends API v1alpha + ArcGIS overlay"],
                    ["Metric",        "Confirmed cases (lagging)",         "Behavioral probabilities (leading)"],
                    ["Resolution",    "County / State",                    "Nielsen DMA (market-specific)"],
                    ["Privacy",       "Subject to reporting delays",       "Overcomes k-anonymity via Grouped Expressions"],
                    ["Outcome",       "Intervention (reactive)",           "Digital Semantic Defense (predictive)"],
                  ].map(([a,b,c],i)=>(
                    <tr key={i} className="border-t border-slate-800/60">
                      <td className="py-1.5 text-slate-300 mono">{a}</td>
                      <td className="py-1.5">{b}</td>
                      <td className="py-1.5 text-emerald-300">{c}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        </section>

        {/* ===== SOURCES (43 across 6 categories) ===== */}
        <section className="col-span-12">
          <Card title="Live Data & Sources" subtitle="43 sources across 6 categories — feeds, agencies, wires, press, science" glow="violet" icon={I("library","w-4 h-4 text-violet-300")}>
            <div className="mb-3 text-[12px] text-slate-300">
              <span className="mono text-violet-300">FeatureServer endpoint</span>:
              <a className="text-cyan-300 underline break-all ml-1" target="_blank" rel="noreferrer"
                 href="https://services1.arcgis.com/wb4Og4gH5mvzQAIV/arcgis/rest/services/Tracking_Hantavirus_2026/FeatureServer/1/query?where=1%3D1&outFields=*&f=geojson&resultRecordCount=2000">
                /Tracking_Hantavirus_2026/FeatureServer/1/query?where=1%3D1&outFields=*&f=geojson
              </a>
            </div>
            {Object.entries(SOURCES).map(([cat, items])=>(
              <div key={cat} className="mb-3">
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-xs uppercase tracking-widest text-violet-300">{cat}</span>
                  <Pill color="slate">{items.length}</Pill>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2">
                  {items.map(([title, url, desc],i)=>(
                    <a key={i} href={url} target="_blank" rel="noreferrer" className="src-card bg-slate-900/55 border border-slate-800 rounded-lg p-2 block">
                      <div className="text-cyan-300 text-sm truncate">{title}</div>
                      <div className="text-[11px] text-slate-400 mt-0.5 leading-snug">{desc}</div>
                      <div className="text-[10px] text-slate-500 mono mt-1 truncate">{url}</div>
                    </a>
                  ))}
                </div>
              </div>
            ))}
            <div className="mt-4 text-[11px] text-slate-500">
              Sister dashboard: <a className="text-cyan-300 underline" href="https://hantaviruslive.info/" target="_blank" rel="noreferrer">Hantavirus Surveillance — Global Situational Dashboard</a>.
            </div>
          </Card>
        </section>

        <footer className="col-span-12 text-center text-[11px] text-slate-400 py-4 border-t border-slate-800 mt-2">
          <div className="flex flex-col items-center gap-1">
            <div>
              <a href="https://www.ndsu.edu/people/akshaya-bhagavathula" target="_blank" rel="noreferrer" className="text-ndsu-gold hover:underline font-semibold">Akshaya Bhagavathula, PhD FACE</a>
              <span className="text-slate-500"> · </span>
              Professor of Epidemiology, Department of Public Health
              <span className="text-slate-500"> · </span>
              <span className="text-ndsu-green font-semibold">North Dakota State University</span>, Fargo, ND USA
            </div>
            <div className="text-[10px] text-slate-500 mono">
              data: Hantavirus_DMA_Master_Merge.csv ({rows.length} rows · {dmas.length} DMAs · {dates.length} days · {dateFirst} → {dateLast}) · For situational awareness only, not medical advice.
            </div>
          </div>
        </footer>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
